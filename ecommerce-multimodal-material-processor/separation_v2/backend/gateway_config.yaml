# 后端网关配置（服务端打标）
# 说明：真实密钥不写在此文件，运行时由同目录 .env 自动注入（overlay）。
# 此文件只放"部署参数"与"严格限制"。

# 管理口令：/admin/issue、/admin/revoke 需要。部署时改成强口令。
admin_secret: "wbAdmin9kP2qLm7zX4vR8tN3cF6"

# 公网地址：会回传给客户填进薄壳 GATEWAY_BASE_URL
public_base_url: "https://sincerelytuner.cloud:8080"

# 技能包下载文件：GET /api/v1/skill/download 会返回该文件（下载名固定为 skill.zip）。
# 相对路径按 backend 目录解析；留空则默认 backend/skill.zip。把 skill.zip 放到该路径即可。
skill_zip_path: "skill.zip"

# 凭证默认配额
credentials:
  default_max_batches: 2        # 每凭证可发起的批量打标次数（label / batch 均计数）

# 严格限制（服务端强制；薄壳只是透传，无法绕过）
limits:
  max_image_size_mb: 50.0      # 单张图片上限（MB）
  max_video_size_mb: 500.0     # 单个视频上限（MB）
  allowed_image_types: ".jpg,.jpeg,.png,.webp,.gif"
  allowed_video_types: ".mp4,.mov,.avi,.mkv"
  max_units_per_batch: 200       # 单次批量单元数上限（图片组 + 视频段合计）
  max_uploads_per_credential: 1000  # 单凭证累计上传文件数上限（防存储滥用）
  max_package_size_mb: 1024      # 压缩包（分块累计）总大小上限；同时必须调大 1Panel/nginx 的 client_max_body_size
  chunk_size_bytes: 2000000      # 分块上传的单块大小（字节，默认 2MB）；客户端按此切块，单块独立重试断点续传
  # 一组图片上限三态：null=无上限 / 0=禁止图片 / 正整数=上限张数
  max_images_per_group: null
